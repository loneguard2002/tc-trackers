{#- The report email. ``body_html`` is the rendered owner template (trusted HTML, placeholder values already escaped);
    ``chart_src`` is cid:remaining-chart in the email and a data URI in the preview. -#}
<!doctype html>
<html lang="en-GB">
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; font-size: 14px; line-height: 1.5;">
{{ body_html|safe }}
<p><img src="{{ chart_src }}" alt="Remaining {{ unit_label }}: plan, actual and forecast" style="max-width: 100%; height: auto;"></p>
<p><a href="{{ link }}">View the full report</a> (sign-in required). The PDF is attached.</p>
</body>
</html>
