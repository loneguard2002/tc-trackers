{% extends "base.html" %}
{% from "macros.html" import csrf_field %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    {{ csrf_field(csrf_token()) }}
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <div class="form-row">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required>
    </div>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  {% if sso_enabled %}
  <p><a class="button" href="{{ url_for('sso.sso_start') }}">Sign in with Microsoft</a></p>
  {% endif %}
</section>
{% endblock %}
